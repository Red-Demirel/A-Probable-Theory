    All phenomena emerge from local comparisons within healing length ξ.
    
  status: |
    Working theoretical framework - continuous refinement.
    Mathematically coherent, testable predictions, fringe but not crackpot.

# ============================================================================
# THE SUPERFLUID SUBSTRATE
# ============================================================================

superfluid_definition:
  nature: "Quantum superfluid (Bose-Einstein condensate) at Planck scale"
  
  primitive_field:
    quantity: "p(r,t) - momentum density at each lattice point"
    lattice_spacing: "a ≈ ℓ_Planck ≈ 1.616×10⁻³⁵ m"
    update_cycle: "τ ≈ t_Planck ≈ 5.391×10⁻⁴⁴ s"
    
  what_doesnt_exist:
    - "Absolute momentum values (only gradients observable)"
    - "Global reference frame (fully relational)"
    - "Fixed background density (dynamic p_env)"
    - "Separate force fields (all from p-field patterns)"
    
  ground_state:
    viscosity: "lim→0 (ideal superfluid, never exactly zero)"
    friction: "Zero when ∇p = 0 (no gradients)"
    resistance: "Self-generated from motion (creates own impedance)"
    
  key_properties:
    - "Motion → density variations (compression/rarefaction)"
    - "Density variations = friction/resistance"
    - "Above critical velocity → excitations spawn"
    - "Topologically stable structures (vortices) persist"
    - "Healing length ξ sets local averaging scale"

# ============================================================================
# TWO FUNDAMENTAL QUANTITIES
# ============================================================================

core_variables:
  
  S_anomaly:
    symbol: "S"
    name: "The Anomaly"
    definition: "S = |p(r,t) - p_env(r,t)|"
    meaning: "Local deviation from environmental momentum density"
    
    interpretation:
      - "S = 0: Perfect equilibrium with environment"
      - "S > 0: Localized structure/excitation"
      - "S → S_max: Saturation (event horizon)"
      
    examples:
      particle: "High S (large deviation from vacuum)"
      void: "Low S (small fluctuations)"  
      photon: "Minimal S (nearly equilibrium)"
      
  R_resistance:
    symbol: "R"
    name: "The Resistance" 
    definition: "R = p_env × κ × (1 + β × Ξ)"
    meaning: "Environmental impedance to momentum redistribution"
    
    components:
      base: "p_env × κ (background resistance)"
      complexity: "β × Ξ (turbulence enhancement)"
      
    Ξ_complexity:
      formula: "Ξ = |∇×p|²/|p|² + (∇ρ)²/ρ²"
      meaning: "Turbulence/vorticity index"
      
    interpretation:
      - "R low: Easy redistribution (voids, smooth flow)"
      - "R high: Difficult redistribution (dense, turbulent)"
      - "R → ∞: Complete blockage (event horizon)"
      
  environmental_average:
    definition: "p_env(r,t) = ∫ p(r',t) × W(|r-r'|) d³r'"
    kernel: "W ∝ exp(-|r-r'|/L_decay) (exponential weighting)"
    decay_length: "L_decay = c/γ ~ 400-4000 Mpc"
    meaning: "Local causally-connected average, not global"

# ============================================================================
# FIVE UNIVERSAL RULES (The Mechanism)
# ============================================================================

five_rules:
  
  rule_1_timing:
    name: "Cycle Rate Scaling"
    statement: "Δt_local ∝ R"
    equation: "Δt_local = τ_base × R(x)"
    
    meaning: |
      Higher resistance → slower local processes
      Time dilation from cycle rate variation
      
    examples:
      - "Deep gravitational well → high R → time slows"
      - "Void → low R → time flows faster"
      - "Photon → R minimal → zero proper time"
      
  rule_2_inertia:
    name: "Resistance to Change"
    statement: "m_eff ∝ S × R"
    equation: "m_eff = α × S × R / c²"
    
    meaning: |
      Larger anomaly S → more to reorganize
      Higher resistance R → harder to reorganize
      Product gives inertial mass
      
    examples:
      - "Particle with large S in moderate R environment"
      - "Massless photon: S minimal → m_eff ≈ 0"
      - "Relativistic increase: moving → effective S increases"
      
  rule_3_stability:
    name: "Persistence Threshold"
    statement: "Stable if S > R_threshold"
    equation: "S > R × f(Ξ_local)"
    
    meaning: |
      Structure persists only when anomaly exceeds 
      resistance barrier
      
    examples:
      - "Tik interference creates S > R_limit → stable vortex"
      - "Galaxy cores: high S, high Ξ → stable"
      - "Voids: low R but also low S → unstable"
      
  rule_4_causality:
    name: "Speed Limit"
    statement: "v_max = c√(1 - S²/S_max²)"
    equation: "v ≤ c × √(1 - (S/S_max)²)"
    
    meaning: |
      As anomaly approaches maximum gradient,
      speed limit decreases
      
    examples:
      - "Photon: S ≈ 0 → v ≈ c"
      - "Massive particle: finite S → v < c"
      - "Event horizon: S → S_max → v → 0"
      
  rule_5_refraction:
    name: "Path Curvature"
    statement: "d²x/dt² = -c²∇ln(R)"
    equation: "Acceleration ∝ -∇R"
    
    meaning: |
      Particles/light follow paths toward higher 
      resistance regions (like optical refraction)
      
    examples:
      - "Planetary orbits follow ∇R gradient"
      - "Light bending toward high-density (high-R)"
      - "Gravity = geometric effect of R gradients"

# ============================================================================
# RULE 6 - RELATIONAL INTERFACE (The Medium)
# ============================================================================

rule_6_environmental:
  name: "Local Gradient Relativity"
  statement: "All dynamics relative to local environmental field p_env"
  
  principle: |
    Physics is fundamentally relational - only differences matter.
    No absolute momentum, only comparisons within causally 
    connected region (set by L_decay).
    
  definitions:
    S: "|p - p_env| (local deviation)"
    R: "p_env × κ × (1 + β × Ξ) (environmental impedance)"
    
  locality: |
