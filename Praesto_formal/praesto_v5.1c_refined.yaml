    accumulation: Gradual post-formation, but formation rate is peaked
    
  observational_signatures:
    - Ellipticals > Spirals in solo vortex density (violent vs calm formation)
    - Merging galaxies show temporary solo vortex excess
    - Galactic magnetic fields correlate with formation violence
    - Outer halo: Fewer solos (quieter formation)
    
  cosmological_implication:
    - Solo vortex density is a "fossil record" of formation turbulence
    - Can reconstruct galactic merger history from free vortex distribution

# ==============================================================================
# QUANTUM HYDRODYNAMICS FOUNDATION
# ==============================================================================

qhd_formalism:
  
  substrate_as_superfluid:
    wavefunction: ψ = √ρ·exp(iθ)
    schrodinger_equation: iℏ ∂ψ/∂t = [-ℏ²/(2m)∇² + V_ext + g|ψ|²]ψ
    
  madelung_transform:
    density: ρ = |ψ|²
    velocity: v = (ℏ/m)∇θ
    continuity: ∂ρ/∂t + ∇·(ρv) = 0
    
  vortex_quantization:
    circulation: ∮ v·dl = n·(ℏ/m) (quantized, n = integer)
    
  charge_from_chirality:
    paired_vortices: (+n) + (-n) → neutral (photon-like)
    unpaired_vortex: Solo (+n) → net chirality → charge (electron-like)
    galaxy_saturation: High Ξ regions → excess free vortices → macroscopic charge

