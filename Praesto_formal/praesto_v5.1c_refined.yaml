# ==============================================================================
# FOUNDATIONAL ONTOLOGY
# ==============================================================================

ontology:
  
  primitive_field:
    quantity: p(r,t) - momentum density field
    nature: A primordial protoplasmic host – a dynamic, fluctuation-driven medium where energy is not separate but the organized flow and turbulence of the substrate itself. Continuous with characteristic correlation length.

  derived_quantities:
    S_anomaly: |p(r) - p_env(r)| (local deviation from environment)
    R_resistance: p_env × κ × (1 + β·Ξ) (impedance to redistribution)
    Ξ_complexity: |∇×p|²/|p|² + (∇ρ)²/ρ² (turbulence index)
    V_potential: |∇p| (gradient magnitude)
    Φ_capacity: V/R = |∇p|/R (local process rate)
    
  environmental_average:
    p_env(r): ⟨p⟩_ξ(r) (average over healing length)
    ξ(r): ℏ/√(m·c·p_env) (self-consistent averaging scale)
    
  gauge_principle:
    statement: p → p + p₀ leaves physics unchanged
    consequence: Only gradients (∇p) and curvatures (∇²p) are observable
    
  planck_scale:
    role: Substrate grain size (mean free path, not lattice spacing)
    value: ℓ_Planck ≈ 1.6×10⁻³⁵ m
    nature: Dynamic and emergent, not fixed coordinate grid
    
    cutoff_mechanism:
      limit: Minimum stable vortex radius r_min ~ ℓ_Planck
      topology_constraint: |
        For λ < ℓ_Planck: Cannot achieve topological lock
        → Structure dissolves into stochastic background
      consequence: Natural UV regularization from topology, not discretization
      
  singularity_prevention:
    mechanism: |
      Cannot compress below grain size without energy 
      shattering into incoherent background.
      No infinite densities possible.
    advantage: Natural cutoff from physics, not imposed by hand

# ==============================================================================
# FIVE UNIVERSAL MECHANISMS
# ==============================================================================

mechanisms:
  
  rule_1_flow_capacity:
    statement: Process rate proportional to Φ = V/R
    formula: dτ = Φ·dt (proper time from flow capacity)
    
    interpretation: |
      Local clocks run at rate determined by gradient/resistance ratio.
      High R → low Φ → slow processes (gravitational time dilation).
      
    manifestation: Time dilation in gravitational wells
    
  rule_2_inertia:
    statement: Inertial mass proportional to S × R
    formula: m_eff = (α·S·R)/c²
    
    interpretation: |
      Mass emerges from anomaly (what differs) times
      resistance (how hard to change it).
      
    manifestation: Resistance to acceleration
    
  rule_3_stability_threshold:
    statement: |
      Structure persists when S > S_lock
      Structure dissolves when S < S_unlock
      
    hysteresis: S_unlock < S_lock
    
    interpretation: |
      Protects existing structures from noise.
      Once locked, harder to unlock than to initially form.
      
    manifestation: Particle stability despite quantum fluctuations
    
  rule_4_saturation_limit:
    statement: Maximum velocity v_max = c·√(1 - (S/S_max)²)
    
    saturation: S_max = p_env/ℓ_Planck (Planck-scale gradient limit)
    
    interpretation: |
      As anomaly approaches maximum gradient, available
      phase space for motion decreases.
      
    manifestation: Light speed limit (S≈0), Pauli exclusion (S→S_max)
    
  rule_5_refraction:
    statement: Trajectories follow Φ gradients
    formula: d²x/dt² = -c²·∇ln(Φ) = -c²·[∇ln(V) - ∇ln(R)]
    
    components:
      attractive: -c²·∇ln(R) (toward higher resistance)
      repulsive: +c²·∇ln(V) (from potential gradient)
      
    interpretation: |
      Gravity emerges from R gradients (attractive).
      Anti-collapse from V gradients (repulsive).
      No singularities - repulsion dominates at small scales.
      
    manifestation: Geodesics, gravitational lensing, orbital dynamics

# ==============================================================================
# WAVE DYNAMICS - TIK MECHANISM
# ==============================================================================

tik_dynamics:
  nature: Propagating density ripple in p-field
  
  wave_equation: ∂²p/∂t² = c²·∇²p - γ·∂p/∂t
  
  pulse_structure:
    compression_phase: Tik (positive excursion, S increases locally)
    rarefaction_phase: Tok (negative excursion, S decreases)
    unity: Single propagating pulse, not separate events
    conservation: Mass/momentum conserved throughout cycle
    
  stochastic_background:
    origin: Quantum and thermal fluctuations
    isotropy: Arrives from all directions (no preferred source)
    spectrum: S(ω) = (ℏω³/2π²c³)·[n_thermal + 1/2]
    
    role_hierarchy:
      free_space: Tiks dominant (only dynamics present)
      stable_structures: Internal circulation dominant, tiks perturbative
      marginal_structures: Tiks significant (near dissolution threshold)
      
  vortex_nucleation:
    trigger: Wave superposition where S > S_lock
    mechanism: Circulation from radial flow differential
    result: Vortex-antivortex pair with opposite winding
    locking_condition: γ·τ_pulse ~ 1 (critical damping pins topology)
    
  resonant_transponder_model:
    external_driver: Stochastic tik background continuously interacts
    vortex_response: Resonantly couples (active, not passive)
    energy_flow: Absorption → circulation maintenance → leakage
    dissipation: Continuous power loss from topological constraint

# ==============================================================================
# ENTROPY & TIME
# ==============================================================================

entropy_mechanism:
  concept: Topological Leakage
  
  physical_picture: |
    Vortex maintains circulation against viscous drag.
    Maintenance flow continuously leaks energy acoustically.
    Leakage radiates as incoherent tik background.
    
  formula: dS/dt = (γ·Φ·S²)/R
  
  interpretation: |
    Entropy = measurable power dissipation, not abstract disorder.
    Heat = incoherent tik background from vortex leakage.
    Second law emerges from γ > 0 (dissipation always positive).
    
  arrow_of_time:
    origin: Irreversible energy flow from coherent to incoherent
    manifestation: Entropy production dS/dt > 0
    microscopic: Topological maintenance cost
    macroscopic: Thermodynamic equilibration
    
time_ontology:
  not_fundamental: Time is sectional measure (like distance along path)
  definition: τ = ∫ Φ·dt (accumulated phase from flow capacity)
  
  emergence_condition: |
    Requires Ξ > Ξ_crit for irreversible momentum redistribution.
    Below threshold: Reversible dynamics (no arrow of time).
    
  consequence: |
    No global clock - only local proper time rates.
    Time = counting flow cycles in each region.

