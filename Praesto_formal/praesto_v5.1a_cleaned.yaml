  physical_picture: |
    Vortex maintains circulation against viscous drag.
    Maintenance flow continuously leaks energy acoustically.
    Leakage radiates as incoherent tik background.
    
  formula: dS/dt = (γ·Φ·S²)/R
  
  interpretation: |
    Entropy = measurable power dissipation, not abstract disorder.
    Heat = incoherent tik background from vortex leakage.
    Second law emerges from γ > 0 (dissipation always positive).
    
  arrow_of_time:
    origin: Irreversible energy flow from coherent to incoherent
    manifestation: Entropy production dS/dt > 0
    microscopic: Topological maintenance cost
    macroscopic: Thermodynamic equilibration
    
time_ontology:
  not_fundamental: Time is sectional measure (like distance along path)
  definition: τ = ∫ Φ·dt (accumulated phase from flow capacity)
  
  emergence_condition: |
    Requires Ξ > Ξ_crit for irreversible momentum redistribution.
    Below threshold: Reversible dynamics (no arrow of time).
    
  consequence: |
    No global clock - only local proper time rates.
    Time = counting flow cycles in each region.

