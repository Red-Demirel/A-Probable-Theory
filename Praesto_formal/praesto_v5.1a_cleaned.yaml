    R_resistance: p_env × κ × (1 + β·Ξ) (impedance to redistribution)
    Ξ_complexity: |∇×p|²/|p|² + (∇ρ)²/ρ² (turbulence index)
    V_potential: |∇p| (gradient magnitude)
    Φ_capacity: V/R = |∇p|/R (local process rate)
    
  environmental_average:
    p_env(r): ⟨p⟩_ξ(r) (average over healing length)
    ξ(r): ℏ/√(m·c·p_env) (self-consistent averaging scale)
    
  gauge_principle:
    statement: p → p + p₀ leaves physics unchanged
    consequence: Only gradients (∇p) and curvatures (∇²p) are observable
    
  planck_scale:
    role: Substrate grain size (mean free path, not lattice spacing)
    value: ℓ_Planck ≈ 1.6×10⁻³⁵ m
    nature: Dynamic and emergent, not fixed coordinate grid
    
    cutoff_mechanism:
      limit: Minimum stable vortex radius r_min ~ ℓ_Planck
      topology_constraint: |
        For λ < ℓ_Planck: Cannot achieve topological lock
        → Structure dissolves into stochastic background
      consequence: Natural UV regularization from topology, not discretization
      
  scale_regimes:
    macroscopic: 
      condition: λ >> ℓ_Planck
      behavior: Laminar/superfluid (continuum limit)
      physics: Standard field theory valid
      
    planck_scale:
      condition: λ ~ ℓ_Planck
      behavior: Granular/stochastic (noise floor)
      physics: Topological instability, quantum foam
      
  singularity_prevention:
    mechanism: |
      Cannot compress below grain size without energy 
      shattering into incoherent background.
      No infinite densities possible.
    advantage: Natural cutoff from physics, not imposed by hand

