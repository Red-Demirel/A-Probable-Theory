# ==============================================================================
# FIVE UNIVERSAL MECHANISMS
# ==============================================================================

mechanisms:
  
  rule_1_flow_capacity:
    statement: Process rate proportional to Φ = V/R
    formula: dτ = Φ·dt (proper time from flow capacity)
    
    interpretation: |
      Local clocks run at rate determined by gradient/resistance ratio.
      High R → low Φ → slow processes (gravitational time dilation).
      
    manifestation: Time dilation in gravitational wells
    
  rule_2_inertia:
    statement: Inertial mass proportional to S × R
    formula: m_eff = (α·S·R)/c²
    
    interpretation: |
      Mass emerges from anomaly (what differs) times
      resistance (how hard to change it).
      
    manifestation: Resistance to acceleration
    
  rule_3_stability_threshold:
    statement: |
      Structure persists when S > S_lock
      Structure dissolves when S < S_unlock
      
    hysteresis: S_unlock < S_lock
    
    interpretation: |
      Protects existing structures from noise.
      Once locked, harder to unlock than to initially form.
      
    manifestation: Particle stability despite quantum fluctuations
    
  rule_4_saturation_limit:
    statement: Maximum velocity v_max = c·√(1 - (S/S_max)²)
    
    saturation: S_max = p_env/ℓ_Planck (Planck-scale gradient limit)
    
    interpretation: |
      As anomaly approaches maximum gradient, available
      phase space for motion decreases.
      
    manifestation: Light speed limit (S≈0), Pauli exclusion (S→S_max)
    
  rule_5_refraction:
    statement: Trajectories follow Φ gradients
    formula: d²x/dt² = -c²·∇ln(Φ) = -c²·[∇ln(V) - ∇ln(R)]
    
    components:
      attractive: -c²·∇ln(R) (toward higher resistance)
      repulsive: +c²·∇ln(V) (from potential gradient)
      
    interpretation: |
      Gravity emerges from R gradients (attractive).
      Anti-collapse from V gradients (repulsive).
      No singularities - repulsion dominates at small scales.
      
    manifestation: Geodesics, gravitational lensing, orbital dynamics

# ==============================================================================
# WAVE DYNAMICS - TIK MECHANISM
# ==============================================================================

tik_dynamics:
  nature: Propagating density ripple in p-field
  
  wave_equation: ∂²p/∂t² = c²·∇²p - γ·∂p/∂t
  
  pulse_structure:
    compression_phase: Tik (positive excursion, S increases locally)
    rarefaction_phase: Tok (negative excursion, S decreases)
    unity: Single propagating pulse, not separate events
    conservation: Mass/momentum conserved throughout cycle
    
  stochastic_background:
    origin: Quantum and thermal fluctuations
    isotropy: Arrives from all directions (no preferred source)
    spectrum: S(ω) = (ℏω³/2π²c³)·[n_thermal + 1/2]
    
    role_hierarchy:
      free_space: Tiks dominant (only dynamics present)
      stable_structures: Internal circulation dominant, tiks perturbative
      marginal_structures: Tiks significant (near dissolution threshold)
      
    quantum_equivalents:
      uncertainty: Brownian buffeting of vortex boundaries
      tunneling: Noise-assisted barrier crossing
      vacuum_energy: Root-mean-square energy of tik bath
      
  vortex_nucleation:
    trigger: Wave superposition where S > S_lock
    mechanism: Circulation from radial flow differential
    result: Vortex-antivortex pair with opposite winding
    locking_condition: γ·τ_pulse ~ 1 (critical damping pins topology)
    
  resonant_transponder_model:
    external_driver: Stochastic tik background continuously interacts
    vortex_response: Resonantly couples (active, not passive)
    energy_flow: Absorption → circulation maintenance → leakage
    dissipation: Continuous power loss from topological constraint
    
    no_discrete_cycles: |
      Vortex responds continuously to wave bath.
      No sharp Tik-Tok boundaries - just characteristic timescales.

